name: Build APK
on:
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project and sync
        run: |
          npx cap add android
          npm run sync
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anh-huy-kho-xang-dau-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
