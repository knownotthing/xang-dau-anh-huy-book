<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5A57">
<title>Kho &amp; Bán lẻ xăng dầu</title>
<script src="xlsx.full.min.js"></script>
<script src="native.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<style>
:root{--bg:#EDF0EE;--card:#fff;--ink:#16231F;--mut:#5E6D68;--line:#D3DAD6;--pri:#0E5A57;--onpri:#fff;--xang:#E39B0B;--dau:#4C7A34;--bad:#C8352B;--fd:'Barlow Condensed','Arial Narrow',sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1614;--card:#16221F;--ink:#E7EFEB;--mut:#9DB0A9;--line:#2A3B37;--pri:#4FC4B9;--onpri:#06201D;--xang:#F2B33D;--dau:#8FC063;--bad:#FF7468;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1614;--card:#16221F;--ink:#E7EFEB;--mut:#9DB0A9;--line:#2A3B37;--pri:#4FC4B9;--onpri:#06201D;--xang:#F2B33D;--dau:#8FC063;--bad:#FF7468;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Be Vietnam Pro',system-ui,sans-serif;padding-bottom:84px}
main{padding:0 12px;max-width:640px;margin:0 auto}
h1,h2,h3{margin:0}h1{font:700 30px var(--fd)}h2{font:700 26px var(--fd)}h3{font-size:15px;margin-top:6px}
.num{font-family:var(--fd);font-weight:700}.big{font-size:28px;line-height:1}.xl{font-size:48px;line-height:1}
.mut{color:var(--mut);font-size:13px}.bad{color:var(--bad)}.c{text-align:center}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:14px 2px 10px}
.btn{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;background:var(--pri);color:var(--onpri)}
.btn.s{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn.s.bad{color:var(--bad);border-color:var(--bad)}
.btn.d{background:var(--bad);color:#fff}.btn.sm{padding:7px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;display:grid;justify-items:center;gap:3px;font:inherit;color:inherit;text-align:center}
.al{border-color:var(--bad);animation:pu 1.4s infinite}
@keyframes pu{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--bad) 30%,transparent)}}
@media(prefers-reduced-motion:reduce){.al{animation:none}}
.warn{background:color-mix(in srgb,var(--bad) 13%,transparent);border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-weight:500}
.pumps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.pump{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;display:grid;justify-items:center;gap:2px;color:var(--ink);font:inherit}
.pump svg{width:100%;max-width:56px}.pno{font-size:36px;line-height:1}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin-bottom:12px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}.rt{text-align:right}.tot b{font:700 24px var(--fd)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 7px;display:grid;justify-items:center;gap:2px;font:inherit;font-size:12px;position:relative}
nav .on{color:var(--pri);font-weight:700}
#nb{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:9px;min-width:17px;height:17px;font:700 11px/17px var(--fd);font-style:normal}
#sheet{position:fixed;inset:0;z-index:20}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.pl{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-width:640px;margin:0 auto}
.hd{display:flex;justify-content:flex-end}.x{border:0;background:var(--bg);color:var(--ink);width:34px;height:34px;border-radius:17px;font-size:16px}
label,.lb{display:grid;gap:4px;font-size:13px;color:var(--mut)}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.chips{display:flex;gap:8px}.chip{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.gen{border:1px dashed var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.bt{display:grid;justify-items:center}.lk{border:0;background:none;color:var(--bad);font:inherit;font-size:12px;padding:2px 0}
#to{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90%;text-align:center}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.lai{color:#12803A}@media(prefers-color-scheme:dark){.lai{color:#4ADE80}}
.li input{width:auto;flex:1;min-width:0}.sum label{padding:8px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wd{text-align:center;font-size:12px;color:var(--mut)}
.cd{min-height:58px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:4px 1px;font:inherit;color:var(--ink);display:grid;align-content:space-between;justify-items:center;gap:2px}
.cd small{font:700 11px var(--fd)}.cd.td{background:color-mix(in srgb,var(--pri) 14%,var(--card))}.cd.sel{border:2px solid var(--pri)}.cd.e{visibility:hidden}
:root{--xg:#2E9E4F;--dg:#17368A}@media(prefers-color-scheme:dark){:root{--xg:#3DBE6A;--dg:#3A66DA}}
.wv{animation:wv 3.2s linear infinite}.wv2{animation:wv 4.8s linear infinite reverse}@keyframes wv{to{transform:translateX(-60px)}}
@media(prefers-reduced-motion:reduce){.wv,.wv2{animation:none}}
.hh{align-items:start;gap:12px}.hh .li{display:block;font-size:13px}.gs{font-size:11px;font-weight:700;line-height:1.2}
.cp .sum{margin-bottom:8px}.cp .li{padding:6px 0}.sum{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{font-weight:500;color:var(--mut);text-align:right;padding:6px 3px}.tb td{text-align:right;padding:7px 3px;border-top:1px solid var(--line);font:700 15px var(--fd)}.tb th:first-child,.tb td:first-child{text-align:left;font:500 14px 'Be Vietnam Pro',system-ui,sans-serif}
</style></head><body>
<main id="v"></main>
<nav>
<button data-t="tk" onclick="go('tk')"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6v12a7 2.5 0 0 0 14 0V6"/><ellipse cx="12" cy="6" rx="7" ry="2.5"/><path d="M5 12.5a7 2.5 0 0 0 14 0"/></svg><span>Tồn kho</span><i id="nb" hidden></i></button>
<button data-t="bl" onclick="go('bl')"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="10" height="18" rx="2"/><rect x="6.5" y="5.5" width="5" height="4"/><path d="M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V9l-2.5-3M3 21h12"/></svg><span>Bán lẻ</span></button>
<button data-t="tc" onclick="go('tc')"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4z"/><path d="M4 7l11-3v3M16 13.5h4"/></svg><span>Thu/Chi</span></button>
<button data-t="ls" onclick="go('ls')"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Lịch sử</span></button>
</nav>
<div id="sheet" hidden></div><div id="to" hidden></div>
<script>
const $=s=>document.querySelector(s),K='kho_xd_v2',
fmt=n=>Math.round(n||0).toLocaleString('en-US'),f1=n=>(Math.round((n||0)*10)/10).toLocaleString('en-US'),n1=n=>n==null?'—':f1(n),
E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
dt=t=>new Date(t).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),
col=f=>f=='x'?'var(--xg)':'var(--dg)',fn=f=>f=='x'?'Xăng':'Dầu',
T=id=>S.tanks.find(t=>t.id==id),B=id=>S.barems.find(b=>b.id==id),
pct=t=>t.cap?Math.min((t.v||0)/t.cap,1):0,low=t=>t.v!=null&&pct(t)<.1;
let S,tab='tk';
function cyl(r,L,h){h=Math.min(Math.max(h,0),2*r);if(h<=0)return 0;return(r*r*Math.acos((r-h)/r)-(r-h)*Math.sqrt(Math.max(2*r*h-h*h,0)))*L/1000}
function gen(D,L){const a=[];for(let h=0;h<D;h+=10)a.push(h);a.push(D);return a.map(h=>[h,Math.round(cyl(D/2,L,h))])}
function volOf(b,h){const t=b.rows;if(h<=t[0][0])return t[0][0]?t[0][1]*h/t[0][0]:t[0][1];for(let i=1;i<t.length;i++)if(h<=t[i][0]){const[a,x]=t[i-1],[c,y]=t[i];return x+(y-x)*(h-a)/(c-a)}return t[t.length-1][1]}
function seed(){const b={id:1,name:'Bồn trụ nằm ngang Ø200 × 318 cm',rows:gen(200,318)},
mk=(id,name,fuel)=>({id,name,fuel,cap:10000,bid:1,h:null,v:10000,log:[]});
return{tanks:[mk(1,'Bồn 1 (Xăng E10 III)','x'),mk(2,'Bồn 2 (Dầu D.O 0,05%s II)','d')],barems:[b],pumps:[{n:'Dầu 0.05%s II',f:'d',tank:2},{n:'Xăng E10 III',f:'x',tank:1},{n:'Xăng E10 III',f:'x',tank:1},{n:'Dầu 0.05%s II',f:'d',tank:2}],rec:[],imp:[],shift:1}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();S.hist=S.hist||[];S.pin=S.pin||'';
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function toast(m){const e=$('#to');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400)}
function sh(h){$('#sheet').innerHTML=`<div class="bk" onclick="cl()"></div><div class="pl"><div class="hd"><button class="x" onclick="cl()" aria-label="Đóng">✕</button></div>${h}</div>`;$('#sheet').hidden=false}
function cl(){$('#sheet').hidden=true;$('#sheet').innerHTML=''}
function ask(m,f){sh(`<p>${m}</p><div class="r2"><button class="btn s" onclick="cl()">Huỷ</button><button class="btn d" id="ok">Đồng ý</button></div>`);$('#ok').onclick=()=>{cl();f()}}
function fuP(e){e.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c==e))}
function go(t){tab=t;render();scrollTo(0,0)}

function tank(p,c,w){const i='k'+Math.random().toString(36).slice(2,7),Y=30,H=220,Bt=Y+H,y=Bt-H*Math.min(p,1),d='M15 30v220a40 12 0 0 0 80 0v-220a40 12 0 0 0-80 0z';
let t='';[.1,.25,.5,.75].forEach(q=>{const k=Bt-H*q,s=q==.1?'var(--bad)':'var(--mut)';t+=`<path d="M95 ${k}h7" style="stroke:${s};stroke-width:1.5"/><text x="104" y="${k+3}" style="font:11px var(--fd);fill:${s}">${Math.round(q*100)}</text>`});
return`<svg viewBox="0 0 135 280" width="${w}" role="img" aria-label="Mức tồn ${Math.round(p*100)}%"><defs><clipPath id="${i}"><path d="${d}"/></clipPath><linearGradient id="${i}g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".3" stop-color="#fff" stop-opacity=".06"/><stop offset=".85" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient></defs><g clip-path="url(#${i})">${p>0?`<rect x="0" y="${y}" width="135" height="270" style="fill:${c};opacity:.78"/><ellipse cx="55" cy="${y}" rx="40" ry="12" style="fill:${c}"/><ellipse cx="55" cy="${y}" rx="40" ry="12" fill="#fff" opacity=".22"/>${wave(y,c,'',.55)}${wave(y+3,c,'2',.4)}`:''}<rect width="135" height="280" fill="url(#${i}g)"/></g><path d="${d}" fill="none" style="stroke:var(--ink);stroke-opacity:.6;stroke-width:2.5"/><ellipse cx="55" cy="30" rx="40" ry="12" fill="none" style="stroke:var(--ink);stroke-opacity:.6;stroke-width:2"/>${t}</svg>`}
const pump=(c,pr)=>`<svg viewBox="0 0 64 84"><rect x="6" y="4" width="36" height="72" rx="5" style="fill:${c}"/><rect x="11" y="10" width="26" height="16" rx="2" fill="#10201c"/><text x="24" y="19" text-anchor="middle" style="font:700 8.5px var(--fd);fill:#7ff0c0">${pr||'—'}</text><text x="24" y="24.3" text-anchor="middle" style="font:5px var(--fd);fill:#7ff0c0">đ/lít</text><rect x="11" y="32" width="26" height="20" rx="2" fill="#fff" opacity=".3"/><rect x="2" y="76" width="44" height="6" rx="2" fill="#10201c"/><path d="M42 30h8q6 0 6 6v24" fill="none" stroke="#10201c" stroke-width="3.5" stroke-linecap="round"/><rect x="51" y="58" width="9" height="14" rx="2" fill="#10201c"/></svg>`;

function render(){const L=S.tanks.filter(low);$('#nb').hidden=!L.length;$('#nb').textContent=L.length;
$('#v').innerHTML=tab=='tk'?vTank():tab=='bl'?vPump():tab=='tc'?vThu():vHist();
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}

function vTank(){const L=S.tanks.filter(low);
return`<div class="row"><h1>Tồn kho</h1><div><button class="btn s sm" onclick="bmList()">Barem</button> <button class="btn sm" onclick="impForm()">Nhập hàng</button> <button class="btn sm" onclick="tkForm()">+ Thêm bồn</button></div></div>`+
(L.length?`<div class="warn">Cảnh báo: ${L.map(t=>E(t.name)).join(', ')} còn dưới 10%. Cần nhập hàng.</div>`:'')+
(S.tanks.length?`<div class="grid">${S.tanks.map(t=>`<button class="tk${low(t)?' al':''}" onclick="tkOpen(${t.id})">${tank(pct(t),low(t)?'var(--bad)':col(t.fuel),96)}<b>${E(t.name)}</b><span class="num big"${low(t)?' style="color:var(--bad)"':''}>${t.v==null?'Chưa đo':f1(pct(t)*100)+'%'}</span><span class="mut">${fmt(t.v)} / ${fmt(t.cap)} lít</span><span class="mut">Giá cost TB: ${fmt(avgCost(t.id))} đ/lít</span>${low(t)?'<span class="bad"><b>Sắp hết hàng</b></span>':''}</button>`).join('')}</div>`:'<p class="mut">Chưa có bồn nào. Nhấn “Thêm bồn” để bắt đầu.</p>')}

/*function tkOpen(id){const t=T(id);if(!t)return;const b=B(t.bid);
sh(`<h2>${E(t.name)}</h2><div class="bt">${tank(pct(t),low(t)?'var(--bad)':col(t.fuel),210)}</div>
<div class="c"><div class="num xl"${low(t)?' style="color:var(--bad)"':''}>${t.h==null?'Chưa đo':f1(pct(t)*100)+'%'}</div><div>${fmt(t.v)} / ${fmt(t.cap)} lít${t.h!=null?`, mực ${t.h} cm`:''}</div>${low(t)?'<div class="bad"><b>Tồn kho dưới 10%. Cần nhập hàng.</b></div>':''}</div>
<label>Chiều cao mực chất lỏng (cm)<input id="h" type="number" inputmode="decimal" min="0" step="0.1" oninput="pv(${id})"></label>
<div id="pvw" class="mut">${b?'Barem: '+E(b.name):'Bồn chưa có barem. Nhấn Sửa bồn để chọn barem.'}</div>
<button class="btn" onclick="tkSave(${id})">Lưu số đo</button>
<div class="r2"><button class="btn s" onclick="tkForm(${id})">Sửa bồn</button><button class="btn s bad" onclick="tkDel(${id})">Xoá bồn</button></div>
${t.log.length?'<h3>Lịch sử đo</h3>'+t.log.slice(0,6).map(x=>`<div class="li"><span>${dt(x.t)}</span><span>${x.h} cm → ${fmt(x.v)} lít</span></div>`).join(''):''}`)}
function pv(id){const t=T(id),b=B(t.bid),h=parseFloat($('#h').value);if(!b||isNaN(h))return;const v=volOf(b,h);
$('#pvw').innerHTML=`Tồn kho: <b>${fmt(v)} lít</b> (${f1(v/t.cap*100)}%)`+(h>b.rows[b.rows.length-1][0]?'<br><span class="bad">Vượt chiều cao cuối bảng barem</span>':'')}
function tkSave(id){const t=T(id),b=B(t.bid),h=parseFloat($('#h').value);
if(!b)return toast('Bồn chưa có barem. Nhấn Sửa bồn để chọn.');
if(!(h>=0))return toast('Nhập chiều cao mực (cm)');
t.h=h;t.v=volOf(b,h);t.log.unshift({t:Date.now(),h,v:t.v});t.log.length=Math.min(t.log.length,20);
save();render();tkOpen(id);toast(low(t)?'Cảnh báo: tồn kho dưới 10%':'Đã lưu số đo')}*/
function tkOpen(id){const t=T(id);if(!t)return;const b=B(t.bid),im=S.imp.filter(x=>x.k==id).sort((a,c)=>c.t-a.t).slice(0,5);
sh(`<h2>${E(t.name)}</h2><div class="bt">${tank(pct(t),low(t)?'var(--bad)':col(t.fuel),210)}</div>
<div class="c"><div class="num xl"${low(t)?' style="color:var(--bad)"':''}>${t.v==null?'Chưa đo':f1(pct(t)*100)+'%'}</div><div>${fmt(t.v)} / ${fmt(t.cap)} lít${t.h!=null?`, đo gần nhất ${t.h} cm`:''}</div><div class="mut">Giá cost trung bình: ${fmt(avgCost(t.id))} đồng/lít. Tổng giá cost đã nhập: ${fmt(tcost(t.id))} đồng</div>${low(t)?'<div class="bad"><b>Tồn kho dưới 10%. Cần nhập hàng.</b></div>':''}</div>
<button class="btn" onclick="impForm(${id})">Nhập hàng vào bồn</button>
<button class="btn s" onclick="adjForm(${id})">Chỉnh tồn kho thực tế (cần PIN)</button>
<button class="btn s" onclick="cbForm(${id})">Đặt giá cost trung bình</button>
<label>Chiều cao mực chất lỏng (cm)<input id="h" type="number" inputmode="decimal" min="0" step="0.1" oninput="pv(${id})"></label>
<div id="pvw" class="mut">${b?'Barem: '+E(b.name):'Bồn chưa có barem. Nhấn Sửa bồn để chọn barem.'}</div>
<button class="btn s" onclick="tkSave(${id})">Lưu số đo</button>
<div class="r2"><button class="btn s" onclick="tkForm(${id})">Sửa bồn</button><button class="btn s bad" onclick="tkDel(${id})">Xoá bồn</button></div>
<div class="r2 hh"><div><h3>Lịch sử nhập hàng</h3>${im.length?im.map(x=>`<div class="li"><b>${dt(x.t)}</b><br>+${fmt(x.l)} lít${x.c?`, cost ${fmt(x.c)} đ/lít`:''}<br><span class="mut">Tồn sau: ${fmt(x.a)} lít</span></div>`).join(''):'<p class="mut">Chưa có</p>'}</div>

function pv(id){const t=T(id),b=B(t.bid),h=parseFloat($('#h').value);if(!b||isNaN(h))return;const v=volOf(b,h),d=v-(t.v||0);

const avgCost=id=>{const t=T(id),b=t&&t.base;let l=b?b.l:0,s=b?b.l*b.c:0;S.imp.forEach(x=>{if(x.k==id&&x.c>0&&(!b||x.t>=b.t)){l+=x.l;s+=x.l*x.c}});return l?s/l:0};
function calc(){const c=CU(),z=()=>({l:0,m:0,v:0}),F={x:z(),d:z()};let nc=false;
S.rec.filter(x=>x.s==S.shift).forEach(x=>{const a=F[x.f]||F.x,g=avgCost(x.k);if(!g)nc=true;a.l+=x.l;a.m+=x.m;a.v+=x.l*g});
const sm=a=>a.reduce((t,x)=>t+x.a,0),thu=sm(c.thu),chi=sm(c.chi),X=F.x,D=F.d,ban=X.m+D.m,need=ban+thu-chi,real=N(c.tt),lnx=X.m-X.v,lnd=D.m-D.v,ln=lnx+lnd,khac=(N(c.ll)||0)*c.s;
return{c,X,D,nc,thu,chi,ban,need,real,diff:isNaN(real)?null:real-need,lnx,lnd,ln,khac,ll:ln+khac}}
function sumHtml(){const k=calc(),row=(n,a)=>`<tr><td>${n}</td><td>${f1(a.l)}</td><td>${fmt(a.m)}</td><td>${fmt(a.v)}</td><td class="${lc(a.m-a.v)}">${fmt(a.m-a.v)}</td></tr>`,
T2={l:k.X.l+k.D.l,m:k.X.m+k.D.m,v:k.X.v+k.D.v};
return`<div class="sum"><table class="tb"><tr><th></th><th>Tổng lít</th><th>Tổng tiền</th><th>Giá vốn</th><th>Lợi nhuận</th></tr>${row('Xăng',k.X)}${row('Dầu',k.D)}${row('Tổng',T2)}</table></div>
<div class="mut">Giá vốn = số lít bán × giá cost trung bình của bồn. Đơn vị tiền: đồng.</div>${k.nc?'<div class="bad">Chưa nhập giá cost cho một bồn nên lợi nhuận chưa chính xác.</div>':''}`}
const tfx=k=>`= Lợi nhuận xăng dầu ${fmt(k.ln)} + Lãi bán hàng khác ${fmt(k.khac)}`;
function pxAsk(i,o){const p=S.pumps[i];sh(`<h2>Đồng bộ đơn giá?</h2><p>Đơn giá ${fn(p.f)} mới là <b>${fmt(p.pr)} đồng/lít</b>. Áp dụng luôn cho ${o.map(j=>'Trụ '+(j+1)+' (hiện '+(S.pumps[j].pr?fmt(S.pumps[j].pr):'chưa có giá')+')').join(', ')} không?</p><div class="r2"><button class="btn s" onclick="pmOpen(${i})">Không</button><button class="btn" onclick="pxOk(${i},[${o}])">Đồng bộ</button></div>`)}
function pxOk(i,o){const pr=S.pumps[i].pr;o.forEach(j=>setPrice(j,pr));save();render();pmOpen(i);toast('Đã đồng bộ đơn giá')}
let hdet=false;
function hdt(){hdet=!hdet;render()}
function sumTable(sel){const Y=+sel.slice(0,4),M=+sel.slice(5,7),Q=Math.ceil(M/3),yy=h=>+h.d.slice(0,4)==Y,mm=h=>yy(h)&&+h.d.slice(5,7)==M,qq=h=>yy(h)&&Math.ceil(+h.d.slice(5,7)/3)==Q,
sd=new Date(sel+'T00:00:00'),w0=new Date(sd);w0.setDate(sd.getDate()-(sd.getDay()+6)%7);const w1=new Date(w0);w1.setDate(w0.getDate()+6);const W=ds(w0),W1=ds(w1),
P=[[`Ngày ${sel.split('-').reverse().join('/')}`,h=>h.d==sel],[`Tuần ${pad(w0.getDate())}/${pad(w0.getMonth()+1)} – ${pad(w1.getDate())}/${pad(w1.getMonth()+1)}`,h=>h.d>=W&&h.d<=W1],[`Tháng ${M}/${Y}`,mm]];
if(hdet)P.push([`Quý ${Q}/${Y}`,qq],[`Năm ${Y}`,yy]);
const row=([n,f])=>{const L=S.hist.filter(f),s=g=>L.reduce((a,h)=>a+(g(h)||0),0),ll=s(h=>h.ll),df=s(h=>h.diff);return`<tr><td>${n}</td><td class="${lc(ll)}">${fmt(ll)}</td><td class="${lc(df)}">${fmt(df)}</td><td>${f1(s(h=>h.xl))}</td><td>${f1(s(h=>h.dl))}</td></tr>`};
return`<div class="sum"><table class="tb"><tr><th></th><th>Lãi/Lỗ</th><th>Dư/Thiếu</th><th>Lít xăng</th><th>Lít dầu</th></tr>${P.map(row).join('')}</table></div><button class="btn s sm" onclick="hdt()">${hdet?'Ẩn chi tiết':'Chi tiết'}</button><div class="mut">Lãi/Lỗ và Dư/Thiếu: số dương là lãi hoặc dư, số âm là lỗ hoặc thiếu. Đơn vị tiền: đồng. Quý và năm hiện khi nhấn Chi tiết.</div>`}
const cnt=i=>S.rec.filter(r=>r.p==i&&(r.gd||ds(new Date(r.t)))==tdy()).length,gcN=i=>cnt(i)?`Giao ca lần ${cnt(i)+1} trụ ${i+1}`:`Giao ca trụ ${i+1}`;
function pinChk(p){if(!/^\d{6}$/.test(p))return'Mã PIN gồm đúng 6 chữ số';if(S.pin&&hp(p)!=S.pin)return'Mã PIN không đúng';if(!S.pin)S.pin=hp(p);return''}
function cbForm(id){const t=T(id),a=avgCost(id);
sh(`<h2>Giá cost trung bình hiện tại</h2><div class="mut">${E(t.name)}. Giá đang tính: ${fmt(a)} đồng/lít. Giá bạn đặt sẽ là giá nền cho tồn kho hiện tại (${fmt(t.v)} lít). Các đợt nhập sau đó được tính trung bình theo số lít.</div>
<label>Giá cost trung bình (đồng/lít)<input id="cb" inputmode="decimal" value="${a?fc(Math.round(a)):''}" oninput="ni(this)"></label>
<button class="btn" onclick="cbOk(${id})">Lưu giá cost trung bình</button>`)}
function cbOk(id){const t=T(id),c=N($('#cb').value);if(!(c>0))return toast('Nhập giá cost (đồng/lít)');t.base={c,l:Math.max(t.v||0,1),t:Date.now()};save();render();tkOpen(id);toast('Đã đặt giá cost trung bình '+fmt(c)+' đồng/lít')}
function pmOpen(i){const p=S.pumps[i],k=T(p.tank),r=S.rec.filter(x=>x.p==i).sort((a,b)=>b.t-a.t);
sh(`<h2>Trụ ${i+1} (${E(p.n)})</h2><div class="mut">Trừ tồn kho: ${k?E(k.name):'chưa liên kết bồn'}</div>
<div class="r2"><button class="btn" onclick="gcForm(${i})">${gcN(i)}</button><button class="btn s" onclick="pmCfg(${i})">Cài đặt trụ</button></div>${ph(i)}<h3>Lịch sử bán hàng</h3>`+
(r.length?r.map(x=>`<div class="li"><span>${dt(x.t)}${x.ed?' (đã sửa)':''}<br><span class="mut">Ca ${x.s}${x.gd?', ngày '+x.gd.split('-').reverse().join('/'):''}, ${fn(x.f)}, ${fmt(x.pr)} đ/lít<br>Điện tử ${f1(x.e)}, cơ ${n1(x.c)}</span></span><span class="rt"><b>${f1(x.l)} lít</b><br>${fmt(x.m)} đồng<br><button class="lk" style="color:var(--pri)" onclick="rcForm(${x.id},${i})">Sửa</button> <button class="lk" onclick="recDel(${x.id},${i})">Xoá</button></span></div>`).join(''):'<p class="mut">Trụ này chưa có lần giao ca nào.</p>'))}
function rcForm(id,i){const x=S.rec.find(r=>r.id==id);if(!x)return;
sh(`<h2>Sửa giao ca trụ ${i+1}</h2><div class="mut">${dt(x.t)}, ca ${x.s}.${x.s!=S.shift?' Ca này đã chốt: sửa tại đây không làm đổi số liệu đã lưu trong Lịch sử.':''} Lưu sẽ ghi đè lên giao ca này và tính lại tồn kho bồn.</div>
<label>Tổng ca (số lít điện tử)<input id="re" inputmode="decimal" value="${fc(x.e)}" oninput="ni(this)"></label>
<label>Tổng ca (số lít cơ)<input id="rc" inputmode="decimal" value="${fc(x.c)}" oninput="ni(this)"></label>
<label>Số lít bán trong ca<input id="rl" inputmode="decimal" value="${fc(x.l)}" oninput="ni(this)"></label>
<label>Đơn giá (đồng)<input id="rpr" inputmode="numeric" value="${fc(x.pr)}" oninput="ni(this)"></label>
<label>${S.pin?'Mã PIN (6 số)':'Tạo mã PIN mới (6 số)'}<input id="rp" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label>
<div class="r2"><button class="btn s" onclick="pmOpen(${i})">Huỷ</button><button class="btn" onclick="rcOk(${id},${i})">Lưu và ghi đè</button></div>`)}
function rcOk(id,i){const x=S.rec.find(r=>r.id==id),e=N($('#re').value),c=N($('#rc').value),l=N($('#rl').value),pr=N($('#rpr').value);
if(isNaN(e))return toast('Nhập tổng ca (số lít điện tử)');if(!(l>=0))return toast('Nhập số lít bán trong ca');if(!(pr>0))return toast('Nhập đơn giá (đồng)');
const er=pinChk($('#rp').value);if(er)return toast(er);
const t=T(x.k);let d=0;if(t&&t.v!=null){t.v+=x.d||0;d=Math.min(l,t.v);t.v-=d}
Object.assign(x,{e,c:isNaN(c)?null:c,l,pr,m:Math.round(l*pr),d,ed:Date.now()});save();render();pmOpen(i);toast('Đã ghi đè giao ca')}
function vThu(){const k=calc(),c=k.c,dc=k.diff==null?'':k.diff>=0?'lai':'bad',dl=k.diff==null?'Dư / Thiếu':k.diff>=0?'Dư':'Thiếu';
return`<div class="row"><h1>Thu / Chi</h1><span class="mut">Ca số ${S.shift}</span></div><div class="cp">
<div class="sum"><div class="li"><span>Tổng tiền bán lẻ</span><b>${fmt(k.ban)} đồng</b></div><div class="li"><span>Tổng lợi nhuận xăng dầu</span><b class="${lc(k.ln)}">${fmt(k.ln)} đồng</b></div></div>
${blk('thu','Thu trong ca')}${blk('chi','Chi trong ca')}
<div class="sum"><div class="li tot"><span>Tổng tiền cần có</span><b>${fmt(k.need)} đồng</b></div>
<div class="mut">= Bán lẻ ${fmt(k.ban)} + Thu ${fmt(k.thu)} − Chi ${fmt(k.chi)}</div>
<label>Số tiền thực tế đếm được (đồng)<input id="tt" inputmode="numeric" value="${E(c.tt)}" oninput="ni(this);tcSet()"></label>
<div class="li"><span id="dl">${dl}</span><b id="df" class="${dc}">${k.diff==null?'—':fmt(Math.abs(k.diff))+' đồng'}</b></div></div>
<div class="sum"><div class="lb" style="padding-top:6px">Lãi bán hàng khác (tự nhập)</div><div class="chips"><button class="chip${c.s==1?' on':''}" onclick="tcLL(1)">Lãi</button><button class="chip${c.s==-1?' on':''}" onclick="tcLL(-1)">Lỗ</button></div>
<label><input id="ll" inputmode="numeric" placeholder="Số tiền (đồng)" value="${E(c.ll)}" oninput="ni(this);tcSet()"></label></div>
<div class="sum"><div class="li tot"><span>Tổng lãi / lỗ trong ca</span><b id="tl" class="${lc(k.ll)}">${ls(k.ll)}</b></div><div class="mut" id="tf">${tfx(k)}</div></div></div>
<button class="btn" style="width:100%" onclick="chot()">Chốt sổ và lưu ca</button>`}
function tcSet(){const c=CU();c.tt=$('#tt').value;c.ll=$('#ll').value;save();const k=calc();
$('#df').className=k.diff==null?'':k.diff>=0?'lai':'bad';$('#df').textContent=k.diff==null?'—':fmt(Math.abs(k.diff))+' đồng';$('#dl').textContent=k.diff==null?'Dư / Thiếu':k.diff>=0?'Dư':'Thiếu';
$('#tl').className=lc(k.ll);$('#tl').textContent=ls(k.ll);$('#tf').textContent=tfx(k)}
function chot(){const k=calc();
sh(`<h2>Chốt sổ ca số ${S.shift}</h2><div class="mut">Lưu bán lẻ, thu, chi, tiền đếm được và lãi/lỗ của ca vào lịch sử theo ngày, rồi xoá hết để nhập ca mới. Lịch sử từng trụ vẫn được giữ.</div>
<div class="li"><span>Lợi nhuận xăng dầu</span><b class="${lc(k.ln)}">${fmt(k.ln)} đồng</b></div><div class="li"><span>Lãi bán hàng khác</span><b>${fmt(k.khac)} đồng</b></div>
<div class="li tot"><span>Lãi / Lỗ ca</span><b class="${lc(k.ll)}">${ls(k.ll)}</b></div>
<label>Ngày của ca<input id="cd" type="date" value="${tdy()}"></label>
<div class="r2"><button class="btn s" onclick="cl()">Huỷ</button><button class="btn" onclick="chotOk()">Chốt sổ ca</button></div>`)}
function chotOk(){const k=calc(),d=$('#cd').value||tdy();
S.hist.push({id:Date.now(),d,s:S.shift,xl:k.X.l,xm:k.X.m,dl:k.D.l,dm:k.D.m,vx:k.X.v,vd:k.D.v,ban:k.ban,thu:k.c.thu,chi:k.c.chi,need:k.need,real:isNaN(k.real)?null:k.real,diff:k.diff,lnx:k.lnx,lnd:k.lnd,lnt:k.ln,kh:k.khac,ll:k.ll});
S.shift++;S.cur=null;hv=null;save();cl();render();toast(`Đã lưu ca vào lịch sử. Mở ca số ${S.shift}`)}
render();
</script></body></html>
